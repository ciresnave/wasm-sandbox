[package]
name = "wasm-sandbox"
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
description = "A secure WebAssembly sandbox with dead-simple ease of use, progressive complexity APIs, and comprehensive safety controls"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ciresnave/wasm-sandbox"
repository = "https://github.com/ciresnave/wasm-sandbox"
documentation = "https://docs.rs/wasm-sandbox"
keywords = ["wasm", "webassembly", "sandbox", "security", "isolation"]
categories = ["wasm", "api-bindings", "virtualization"]
authors = ["Eric Evans <ciresnave@gmail.com>"]
exclude = [
    "target/*",
    "benches/*",
    "examples/*",
    "tests/*",
    ".git*",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "API.md",
    "TRAIT_DESIGN.md",
]

[dependencies]
# WebAssembly runtime
wasmtime = { version = "50.0.0", features = ["async", "cache", "cranelift", "component-model"] }
wasmtime-wasi = "50.0.0"

# Security: Force minimum versions for security fixes
idna = "1.1.0"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.73"
futures = "0.3.28"
tokio-stream = "0.1.14"
async-stream = "0.3.5"

# Serialization
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
rmp-serde = "1.3.1"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.75"

# Logging and monitoring
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }

# Security
cap-std = "4.0.3"

# Utilities
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tempfile = "3.8.0"
once_cell = "1.18.0"
dashmap = "6.1.0"
num_cpus = "1.15.0"

# Additional dependencies
rand = "0.10.3"
log = "0.4.20"
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.8"

# wasmer 7 has no native compiler backend on Windows (Cranelift and Singlepass both
# refuse to build there), so the wasmer-runtime feature is non-Windows only.
[target.'cfg(not(windows))'.dependencies]
wasmer = { version = "7.5.0", default-features = false, features = ["sys", "wat", "cranelift"], optional = true }
wasmer-wasix = { version = "0.705.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
mockall = "0.15.0"
rstest = "0.28.0"
tokio-test = "0.4.3"
ctrlc = "3.4.1"

[features]
default = ["wasmtime-runtime"]
wasmtime-runtime = []
wasmer-runtime = ["wasmer", "wasmer-wasix"]
all-runtimes = ["wasmtime-runtime", "wasmer-runtime"]
component-model = []
python-bindings = []
streaming-apis = []

[[bench]]
name = "communication"
harness = false

[[bench]]
name = "startup"
harness = false
